[project]
name = "ai-business-os"
version = "0.1.0"
description = "AI Business Operating System — backend monolith (api, worker, scheduler, core, modules, agents, tools)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.1",
    "celery>=5.4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "types-python-jose>=3.5",
    # Bundled real PostgreSQL binaries, used by scripts/dev_postgres.py to run a local dev
    # database without Docker (not installed on this machine — see TODO.md).
    "pgserver>=0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "core", "modules", "agents", "tools", "integrations", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101: assert is fine in tests. B008: FastAPI's Depends()/Query()/etc. *must* live in argument
# defaults — that's the framework's documented pattern, not the mutable-default-argument bug
# B008 exists to catch.
ignore = ["S101", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All async tests share one event loop, matching production (the app's async engine/pool live
# for the process lifetime). Without this, per-test loops each try to reuse the same
# module-level engine and asyncpg's pre-ping breaks with "MissingGreenlet" on the 2nd+ test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "modules*", "agents*", "tools*", "integrations*"]
